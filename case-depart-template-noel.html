  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E9E6EA; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact;
         display: flex; flex-direction: column; align-items: center; gap: 12mm; padding: 12mm 0; }

  .page { position: relative; width: 210mm; height: 297mm; overflow: hidden;
          box-shadow: 0 2mm 8mm rgba(40, 20, 30, .18); break-after: page; }
  .page:last-child { break-after: auto; }

  @media print {
    html, body { background: none; }
    body { display: block; padding: 0; }
    .page { box-shadow: none; }
  }
  @media screen and (max-width: 230mm) {
    body { zoom: .45; }
  }

  /* ---------- Grille aux coins arrondis (commune aux deux pages) ---------- */
  .grille { position: absolute; left: 15.85%; width: 68.3%; aspect-ratio: 1 / 1;
            border: var(--ext) solid currentColor; border-radius: 15mm; overflow: hidden; }
  .grille { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); }
  .grille span { display: flex; align-items: center; justify-content: center;
                 border-right: var(--fin) solid currentColor; border-bottom: var(--fin) solid currentColor;
                 font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 9mm; line-height: 1; }
  .grille span:nth-child(9n)                     { border-right: none; }
  .grille span:nth-child(9n+3), .grille span:nth-child(9n+6) { border-right-width: var(--epais); }
  .grille span:nth-child(n+73)                   { border-bottom: none; }
  .grille span:nth-child(n+19):nth-child(-n+27),
  .grille span:nth-child(n+46):nth-child(-n+54)  { border-bottom-width: var(--epais); }

  /* ---------- Page de couverture ---------- */
  .couverture { background-color: var(--fond-couverture); background-image: var(--illustration);
